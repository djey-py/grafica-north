<!doctype html>
<html lang="pt-AO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#050914">
  <title>404 — Página não encontrada | Gráfica Noreth</title>
  <meta name="description" content="A página que procura não existe ou foi movida. Volte ao site da Gráfica Noreth.">
  <style>
    :root{color-scheme:dark;--bg:#050914;--panel:#0d1426;--line:#24314a;--aqua:#20b9f2;--muted:#a8b4c8;--white:#f7f9ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#10254a 0%,var(--bg) 55%);color:var(--white);font-family:Manrope,Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(100%,720px);text-align:center;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(13,20,38,.92),rgba(5,9,20,.92));padding:clamp(32px,7vw,72px);box-shadow:0 32px 100px #0008}
    .brand{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}.brand img{display:block;width:min(100%,260px);height:auto;filter:brightness(1.55) saturate(1.15) drop-shadow(0 0 2px rgba(255,255,255,.75))}
    .code{margin:40px 0 0;color:var(--aqua);font-size:clamp(5rem,22vw,10rem);line-height:.9;font-weight:900;letter-spacing:-.08em;text-shadow:0 0 50px #20b9f233}
    h1{margin:24px 0 12px;font-size:clamp(1.4rem,4vw,2rem);letter-spacing:.08em;text-transform:uppercase}p{color:var(--muted);line-height:1.7;margin:0 auto 30px;max-width:440px}
    .button{display:inline-flex;min-height:48px;align-items:center;justify-content:center;border-radius:999px;padding:12px 22px;background:linear-gradient(100deg,#0867e8,#20b9f2);color:#fff;text-decoration:none;font-size:.85rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;transition:transform .2s,filter .2s}.button:hover{transform:translateY(-2px);filter:brightness(1.1)}.button:focus-visible{outline:3px solid white;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="Gráfica Noreth — página inicial"><img src="/logo-grafica-noreth.png" alt="Gráfica Noreth — Prestação de Serviços & Comércio, Lda."></a>
    <div class="code" aria-hidden="true">404</div>
    <h1>Página não encontrada</h1>
    <p>A página que procura não existe ou foi movida.</p>
    <a class="button" href="/">Voltar à página inicial</a>
  </main>
</body>
</html>
